    for (const r of p.reactions) cat[r.id] = { ...r, local: {}, source: "study" };
    for (const g of C.generic.reactions) {
      const ov = { ...(p.reaction_overrides[g.id] || {}) };
      const note = ov.note; delete ov.note;
      let move = g.move, script = g.script;
      if (g.variants) {
        const key = ov.variant || (g.variants[p.profile.trial_type] ? p.profile.trial_type : Object.keys(g.variants)[0]);
        move = g.variants[key].move || move; script = g.variants[key].script;
      }
      delete ov.variant;
      cat[g.id] = { ...g, move, script, local: ov, note, source: "generic" };
    }
    study()._catalog = cat;
    return cat;
  }
  const allFlags = () => [...pack().debrief_flags, ...C.generic.debrief_flags];
  const flagById = (id) => allFlags().find((f) => f.id === id);
  const brief = () => C.generic.brief_framework;
  const poTitle = (po) => (brief()?.objectives.find((o) => o.id === po) || {}).title || po;
  const poChip = (po) => (po ? ` <span class="po" title="BRIEF ${esc(po)}: ${esc(poTitle(po))}">${esc(po)}</span>` : "");

  // Substitute facts; returns text still containing any unanswered {{placeholders}}.
  function fill(text, local) {
    const facts = { ...pack().facts, ...(local || {}) };
    for (let i = 0; i < 3; i++) text = text.replace(/\{\{(\w+)\}\}/g, (m, k) => (k in facts ? facts[k] : m));
    const baby = (state.session && state.session.babyName) || "your baby";
    return text.replace(/\{\{baby_name\}\}/g, baby).replace(/\{\{return_time\}\}/g, "[the time you'll come back]");
  }
  // Scripts must never show an unanswered placeholder: drop those sentences and say so.
  function speakable(text, local) {
    const filled = fill(text, local);
    const sentences = filled.match(/[^.!?]+[.!?]+["”']?\s*|[^.!?]+$/g) || [filled];
    const kept = sentences.filter((s) => !/\{\{\w+\}\}/.test(s));
    const withheld = kept.length < sentences.length;
    let html = esc(kept.join("").trim()).replace(/\[the time you&#39;ll come back\]/g, "<mark>[the time you'll come back]</mark>");
    if (withheld) html += ` <span class="withheld">(one part withheld: waiting on the study team)</span>`;
    return html;
  }
  // Checklist items aren't spoken to families: show unanswered placeholders as a visible note instead.
  const fillNote = (text) => fill(text).replace(/\{\{\w+\}\}/g, "[waiting on the study team]");
  function avoidAsChoice(a) {
    const q = a.match(/^"[^"]*"/);
    return q ? `Say: ${q[0].replace(/^"|"$/g, "“").replace(/“$/, "”")}` : a.replace(/\s*\([^)]*\)\s*$/, "");
  }

  /* ---------- session ---------- */
  function newSession(mode) {
    const p = mode === "practice" ? persona() : null;
    return {
      id: uid(), study: pack().meta.short_name, packVersion: pack().meta.version, mode,
      personaId: p ? p.id : null, personaName: p ? `${p.name} (${p.role})` : null,
      trainee: state.trainee.trim(), babyName: p ? p.baby_name : state.babyName.trim(),
      startedAt: Date.now(), endedAt: null, current: 0, visited: [0],
      coverage: Object.fromEntries(modules().map((m) => [m.id, m.must_cover.map(() => false)])),
      framingsUsed: {}, checklist: {}, events: [], teachBacks: 0,
      idCorrect: 0, idTotal: 0, respCorrect: 0, respTotal: 0,
      autoFlags: [], manualFlags: null, briefRatings: {}, outcome: null, parca: null, notes: "",
      step: null, turn: null
    };
  }
  function log(type, detail) {
    const s = state.session;
    s.events.push({ t: Date.now() - s.startedAt, type, module: modules()[s.current]?.id || null, ...detail });
  }
  function addFlag(id, reason) {
    const s = state.session;
    if (!id || !flagById(id) || s.autoFlags.some((f) => f.id === id)) return;
    s.autoFlags.push({ id, reason });
  }
  const moduleStatus = (m) => { const c = state.session.coverage[m.id]; const n = c.filter(Boolean).length; return n === 0 ? "" : n === c.length ? "done" : "partial"; };
  const missingCoverage = () => modules().flatMap((m) => state.session.coverage[m.id].map((v, i) => (v ? null : { module: m, item: m.must_cover[i] })).filter(Boolean));

  /* ---------- practice flow ---------- */
  function parentTurn(entry, context) {
    const s = state.session;
    const reactionId = entry ? entry.reaction : ENGAGED;
    const line = entry ? entry.line : pick(personas().engaged_lines);
    const cat = reactionCatalog();
    const others = shuffle(Object.keys(cat).filter((k) => k !== reactionId)).slice(0, reactionId === ENGAGED ? 3 : 2);
    const idOptions = shuffle([reactionId, ...others, ...(reactionId === ENGAGED ? [] : [ENGAGED])]);
    s.turn = { reactionId, line, nonverbal: entry ? entry.nonverbal : "", context, idOptions, idChoice: null, respOptions: null, respChoice: null };
    s.step = "identify";
    log("parent", { reaction: reactionId, line });
  }
  function buildResponseOptions(reactionId) {
    const cat = reactionCatalog(), r = cat[reactionId];
    const other = cat[pick(Object.keys(cat).filter((k) => k !== reactionId))];
    return shuffle([
      { kind: "correct", text: r.move },
      { kind: "avoid", text: avoidAsChoice(pick(r.avoid)) },
      { kind: "mismatch", text: other.move, otherLabel: other.label }
    ]);
  }
  function advance() {
    const s = state.session;
    s.turn = null;
    if (s.current < modules().length - 1) {
      s.current++; if (!s.visited.includes(s.current)) s.visited.push(s.current);
      s.step = "present";
    } else {
      s.reachedEnd = true; s.step = "gate";
      const missing = missingCoverage();
      if (missing.length) state.modal = { kind: "gate", missing };
      else startDecision();
    }
  }
  function startDecision() {
    const s = state.session, d = persona().decision;
    state.modal = null;
    log("decision", { outcome: d.outcome, line: d.line });
    if (d.outcome === "no") {
      s.turn = { reactionId: "declines", line: d.line, nonverbal: "", context: "decision", idChoice: "declines", respOptions: buildResponseOptions("declines"), respChoice: null };
      s.step = "respond";
    } else {
      s.step = "decision";
    }
  }
  function endSession(outcome) {
    const s = state.session;
    s.outcome = outcome; s.endedAt = Date.now(); s.step = "done";
    for (const [mod, flag] of Object.entries(pack().coverage_flags || {})) {
      if (s.coverage[mod] && s.coverage[mod].some((v) => !v) && s.outcome !== "ineligible") addFlag(flag, "Required points in this module were not marked as covered");
    }
    if (s.teachBacks === 0 && s.mode === "practice" && s.outcome !== "ineligible") addFlag("no_teach_back", "No teach-back questions were asked");
    if (s.manualFlags === null) s.manualFlags = s.autoFlags.map((f) => f.id);
    log("end", { outcome });
    persist(s);
    state.view = "debrief";
  }

  /* ---------- rendering ---------- */
  function render() {
    const views = { home: renderHome, brief: renderBrief, session: renderSession, debrief: renderDebrief, history: renderHistoryItem };
    app.innerHTML = views[state.view]() + (state.modal ? renderModal() : "");
    const focus = app.querySelector("[data-autofocus]"); if (focus) focus.focus();
  }

  function renderHome() {
    const ps = personas().personas;
    // Several app files may share this browser's storage: only list sessions for studies in this file.
    const known = C.studies.map((st) => st.pack.meta.short_name);
    const sessions = loadSessions().filter((s) => known.includes(s.study));
    const studyCards = C.studies.map((st, i) => `
      <button class="card pick ${i === state.studyIdx ? "selected" : ""}" data-action="study" data-i="${i}">
        <b>${esc(st.pack.meta.short_name)}</b> <span class="pill">${esc(st.pack.profile.trial_type.replace("_", "-"))}</span> <span class="pill">${esc(st.pack.profile.funding.replace("_", " "))}</span>
        <div class="small muted">${esc(st.pack.profile.population)}</div>
        <div class="small muted">Content v${esc(st.pack.meta.version)}</div>
      </button>`).join("");
    const personaCards = ps.map((p) => `
      <button class="card pick ${p.id === state.personaId ? "selected" : ""}" data-action="persona" data-id="${p.id}">
        <div class="row"><div class="avatar">${esc(p.name[0])}</div><div><b>${esc(p.name)}</b><div class="small muted">${esc(p.role)}</div></div><span class="spacer"></span><span class="pill ${p.difficulty.toLowerCase()}">${esc(p.difficulty)}</span></div>
        <p class="small" style="margin-top:8px">${esc(p.summary)}</p>
      </button>`).join("");
    const canStart = state.mode === "guided" || state.personaId;
    return `
      <div class="stack">
        <div><h1>Practice the consent conversation</h1>
        <p class="muted">Recognize how a parent is reacting, choose how to respond, and get feedback. The aim is understanding and a free decision, not enrollment.</p></div>
        <section class="stack"><h2>1. Study</h2><div class="grid cols-2">${studyCards}</div></section>
        <section class="stack"><h2>2. Mode</h2>
          <div class="grid cols-2">
            <button class="card pick ${state.mode === "practice" ? "selected" : ""}" data-action="mode" data-mode="practice"><b>Practice with a simulated parent</b><div class="small muted">Work through the consent form while a scripted parent reacts. Identify each reaction, choose a response, get feedback.</div></button>
            <button class="card pick ${state.mode === "guided" ? "selected" : ""}" data-action="mode" data-mode="guided"><b>Guided role-play</b><div class="small muted">A supervisor or colleague plays the parent. Log their reactions and the app shows the recommended move and script.</div></button>
          </div>
        </section>
        ${state.mode === "practice" ? `<section class="stack"><h2>3. Parent</h2><div class="grid cols-3">${personaCards}</div></section>`
          : `<section class="stack"><h2>3. Scenario</h2><div class="card grid cols-2"><label class="field">Baby's name used in the role-play<input data-bind="babyName" value="${esc(state.babyName)}" placeholder="e.g. Mia"></label></div></section>`}
        <section class="card row">
          <label class="field" style="flex:1;min-width:200px">Trainee name (optional, stays on this device)<input data-bind="trainee" value="${esc(state.trainee)}"></label>
          <button class="btn primary" data-action="brief" ${canStart ? "" : "disabled"}>Continue</button>
        </section>
        ${sessions.length ? `<section class="stack"><h2>Past sessions on this device</h2><div class="card"><table>
          <tr><th>Date</th><th>Study</th><th>Mode</th><th>Parent</th><th>Outcome</th><th>Score</th><th></th></tr>
          ${sessions.map((s) => `<tr><td>${new Date(s.startedAt).toLocaleString()}</td><td>${esc(s.study)}</td><td>${esc(s.mode)}</td><td>${esc(s.personaName || s.babyName || "Role-play")}</td><td>${esc(s.outcome || "—")}</td><td>${s.mode === "practice" ? `${s.respCorrect}/${s.respTotal}` : "—"}</td>
          <td class="row"><button class="btn ghost" data-action="open-history" data-id="${s.id}">Open</button><button class="btn ghost danger" data-action="delete-history" data-id="${s.id}">Delete</button></td></tr>`).join("")}
        </table></div></section>` : ""}
      </div>`;
  }

  function renderBrief() {
    const p = state.mode === "practice" ? persona() : null;
    const items = pack().pre_conversation_checklist;
    return `
      <div class="stack" style="max-width:720px">
        <button class="btn ghost" data-action="home">← Back</button>
        ${p ? `<div class="card parent"><div class="avatar">${esc(p.name[0])}</div><div><h2>${esc(p.name)}, ${esc(p.role.toLowerCase())}</h2><p>${esc(p.summary)}</p><p class="small muted">Baby: ${esc(p.baby_name)} · Difficulty: ${esc(p.difficulty)}</p></div></div>` : ""}
        <div class="card stack">
          <h2>Before the conversation</h2>
          <p class="small muted">Confirm each item for this scenario. Unchecked items are recorded in the debrief.</p>
          <div class="checks">${items.map((c) => `<label><input type="checkbox" data-check="${c.id}"> <span>${esc(fillNote(c.item))}${poChip(c.po)}</span></label>`).join("")}</div>
        </div>
        <div class="row"><span class="spacer"></span><button class="btn primary" data-action="start" data-autofocus>Start conversation</button></div>
      </div>`;
  }

  function renderModuleList() {
    const s = state.session;
    return `<nav class="card sidebar"><h3>Consent form</h3><ol class="modlist">${modules().map((m, i) => {
      const can = s.mode === "guided" || (s.visited.includes(i) && s.step === "present" && i !== s.current);
      return `<li><button data-action="goto" data-i="${i}" class="${i === s.current ? "current" : ""}" ${can ? "" : "disabled"}><span class="dot ${moduleStatus(m)}"></span>${esc(m.title)}</button></li>`;
    }).join("")}</ol>
    <p class="small muted" style="margin-top:10px">${modules().filter((m) => moduleStatus(m) === "done").length}/${modules().length} fully covered · ${s.teachBacks} teach-back${s.teachBacks === 1 ? "" : "s"}</p></nav>`;
  }

  function renderModulePanel(interactive) {
    const s = state.session, m = modules()[s.current];
    const keys = Object.keys(m.framings);
    const active = state.framing[m.id] && m.framings[state.framing[m.id]] ? state.framing[m.id] : keys[0];
    return `<section class="card stack">
      <div class="row"><h2>${s.current + 1}. ${esc(m.title)}</h2></div>
      <div class="tabs" role="tablist">${keys.map((k) => `<button class="tab ${k === active ? "active" : ""}" role="tab" data-action="framing" data-k="${k}">${esc(cap(k))}</button>`).join("")}</div>
      <blockquote>${speakable(m.framings[active])}</blockquote>
      ${m.trainer_note ? `<div class="feedback warn small"><b>Trainer note:</b> ${esc(m.trainer_note)}</div>` : ""}
      <div><h3>Points to cover</h3><div class="checks">${m.must_cover.map((c, i) => `<label><input type="checkbox" data-cover="${i}" ${s.coverage[m.id][i] ? "checked" : ""} ${interactive ? "" : "disabled"}> <span>${esc(c)}${poChip((m.must_cover_po || [])[i])}</span></label>`).join("")}</div></div>
    </section>`;
  }

  function renderParent(turn) {
    const p = persona();
    return `<div class="parent"><div class="avatar">${esc(p.name[0])}</div><div class="stack" style="margin:0"><div class="bubble">${esc(turn.line)}</div>${turn.nonverbal ? `<div class="nonverbal">${esc(turn.nonverbal)}</div>` : ""}</div></div>`;
  }

  function reactionLabel(id) { return id === ENGAGED ? "Engaged, no concern: continue" : reactionCatalog()[id].label; }
  // Neutral name for multiple choice, so the option doesn't echo the parent's words.
  function reactionCategory(id) { return id === ENGAGED ? reactionLabel(id) : reactionCatalog()[id].category || reactionLabel(id); }

  function renderPracticeStep() {
    const s = state.session, t = s.turn, cat = reactionCatalog();
    if (s.step === "present") {
      return `<div class="card row"><span class="muted small">${s.revisit ? "Going back to cover missed points. The parent won't react again." : "Choose a framing, cover the points, then present it."}</span><span class="spacer"></span><button class="btn primary" data-action="present" data-autofocus>Present to ${esc(persona().name)} →</button></div>`;
    }
    if (s.step === "identify") {
      const answered = t.idChoice !== null, right = t.idChoice === t.reactionId;
      return `<div class="card stack">
        ${t.context === "opening" ? `<p class="small muted">As you sit down with ${esc(persona().name)}…</p>` : ""}
        ${renderParent(t)}
        <h3>What is ${esc(persona().name)} showing you?</h3>
        <div class="choices">${t.idOptions.map((id) => {
          const cls = answered ? (id === t.reactionId ? "correct" : id === t.idChoice ? "wrong" : "") : "";
          return `<button class="choice ${cls}" data-action="identify" data-id="${id}" ${answered ? "disabled" : ""}>${esc(reactionCategory(id))}</button>`;
        }).join("")}</div>
        ${answered ? `<div class="feedback ${right ? "good" : "bad"}">${right ? "<b>Right.</b>" : `<b>Not quite.</b> This was: <b>${esc(reactionCategory(t.reactionId))}</b>.`}
          ${t.reactionId !== ENGAGED ? `<div class="small">Typical cues: ${esc(cat[t.reactionId].cues.join(" · "))}</div>` : ""}</div>
          <div class="row"><span class="spacer"></span><button class="btn primary" data-action="after-identify" data-autofocus>${t.reactionId === ENGAGED ? "Continue →" : "Choose your response →"}</button></div>` : ""}
      </div>`;
    }
    if (s.step === "respond" || s.step === "teachback") {
      const r = cat[t.reactionId], answered = t.respChoice !== null, opt = answered ? t.respOptions[t.respChoice] : null;
      let fb = "";
      if (answered) {
        const intro = opt.kind === "correct" ? `<b>Good move.</b> ${esc(r.why)}`
          : opt.kind === "avoid" ? `<b>This is on the avoid list for this reaction.</b> ${esc(r.why)}`
          : `<b>That move fits a different concern</b> (${esc(opt.otherLabel)}), not this one.`;
        fb = `<div class="feedback ${opt.kind === "correct" ? "good" : "bad"} stack">
          <div>${intro}</div>
          ${r.note ? `<div class="small"><b>Study note:</b> ${esc(fill(r.note, r.local))}</div>` : ""}
          ${r.brief_po ? `<div class="small">BRIEF: ${r.brief_po.map((po) => `${esc(po)} ${esc(poTitle(po))}`).join(" · ")}</div>` : ""}
          <div><h3>What to say</h3><blockquote>${speakable(r.script, r.local)}</blockquote></div>
          <div class="small"><b>Avoid:</b><ul class="avoid">${r.avoid.map((a) => `<li>${esc(a)}</li>`).join("")}</ul></div>
        </div>`;
      }
      const tb = s.step === "teachback" ? `<div class="card stack" style="background:var(--accent-soft)"><h3>Check understanding</h3><blockquote>${speakable(r.teach_back, r.local)}</blockquote>
        <div class="row"><button class="btn primary" data-action="teachback" data-done="1" data-autofocus>I asked the teach-back</button><button class="btn" data-action="teachback" data-done="0">Skip</button></div></div>` : "";
      return `<div class="card stack">
        ${renderParent(t)}
        <h3>How do you respond?</h3>
        <div class="choices">${t.respOptions.map((o, i) => {
          const cls = answered ? (o.kind === "correct" ? "correct" : i === t.respChoice ? "wrong" : "") : "";
          return `<button class="choice ${cls}" data-action="respond" data-i="${i}" ${answered ? "disabled" : ""}>${esc(o.text)}</button>`;
        }).join("")}</div>
        ${fb}
        ${answered && s.step === "respond" ? `<div class="row"><span class="spacer"></span><button class="btn primary" data-action="after-respond" data-autofocus>Continue →</button></div>` : ""}
      </div>${tb}`;
    }
    if (s.step === "decision") {
      const d = persona().decision;
      if (d.outcome === "yes") {
        const opt = pack().meta.optional_component;
        return `<div class="card stack"><h3>${esc(persona().name)} decides.</h3>${renderParent({ line: d.line, nonverbal: "" })}
          <div class="feedback info small">In a real conversation: give the family time to read the form and answer remaining questions${opt ? `, and ${esc(opt.advice)}` : ""}. Make sure they get a signed copy.</div>
          ${opt ? `<p class="small">${esc(persona().name)} chooses <b>${d.parca === "yes" ? "yes" : "no"}</b> to ${esc(opt.name)}.</p>` : ""}
          <div class="row"><span class="spacer"></span><button class="btn primary" data-action="end" data-outcome="consented" data-autofocus>Finish and see debrief</button></div></div>`;
      }
      return `<div class="card stack"><h3>${esc(persona().name)} decides.</h3>${renderParent({ line: d.line, nonverbal: "" })}
        <div class="feedback info small">Right next step: confirm when you'll come back (before the decision deadline), leave a copy of the form, and make it clear that saying no is fine.</div>
        <div class="row"><span class="spacer"></span><button class="btn primary" data-action="end" data-outcome="needs time" data-autofocus>Finish and see debrief</button></div></div>`;
    }
    return "";
  }

  function renderGuidedPanel() {
    const cat = reactionCatalog(), s = state.session, sel = state.guidedReaction ? cat[state.guidedReaction] : null;
    const groups = [["Study-specific", Object.values(cat).filter((r) => r.source === "study")], ["General", Object.values(cat).filter((r) => r.source === "generic")]];
    return `<aside class="card stack reaction-col sidebar">
      <h3>Parent reaction</h3>
      ${groups.map(([name, rs]) => `<div><div class="small muted" style="margin-bottom:4px">${name}</div><div class="reactions">${rs.map((r) => `<button class="choice ${state.guidedReaction === r.id ? "active" : ""}" data-action="guided-reaction" data-id="${r.id}">${esc(r.label)}</button>`).join("")}</div></div>`).join("")}
    </aside>`;
    // (selected reaction card renders in the center column; see renderSession)
  }

  function renderGuidedCard() {
    const r = state.guidedReaction && reactionCatalog()[state.guidedReaction];
    if (!r) return `<div class="card small muted">When the parent reacts, tap the reaction on the right. The recommended move and script appear here.</div>`;
    return `<div class="card stack">
      <div class="row"><h3>${esc(r.label)}</h3><span class="spacer"></span><button class="btn ghost" data-action="guided-clear">Close</button></div>
      <p><b>Move:</b> ${esc(r.move)}</p>
      ${r.note ? `<p class="small"><b>Study note:</b> ${esc(fill(r.note, r.local))}</p>` : ""}
      <blockquote>${speakable(r.script, r.local)}</blockquote>
      ${r.teach_back ? `<div class="row"><span><b>Teach-back:</b> <i>${speakable(r.teach_back, r.local)}</i></span><button class="btn" data-action="guided-teachback">Asked ✓</button></div>` : ""}
      <p class="small"><b>Why:</b> ${esc(r.why)}</p>
      <div class="small"><b>Avoid:</b><ul class="avoid">${r.avoid.map((a) => `<li>${esc(a)}</li>`).join("")}</ul></div>
    </div>`;
  }

  function renderSession() {
    const s = state.session;
    const header = `<div class="row" style="margin-bottom:12px"><div><b>${esc(pack().meta.short_name)}</b> · ${s.mode === "practice" ? `Practice with ${esc(persona().name)}` : "Guided role-play"}${s.babyName ? ` · Baby: ${esc(s.babyName)}` : ""}</div><span class="spacer"></span>
      ${s.mode === "guided" ? `<button class="btn primary" data-action="guided-end">End conversation</button>` : `<button class="btn ghost" data-action="abandon">Stop session</button>`}</div>`;
    if (s.mode === "guided") {
      return header + `<div class="session guided">${renderModuleList()}<div class="stack">${renderGuidedCard()}${renderModulePanel(true)}</div>${renderGuidedPanel()}</div>`;
    }
    const interactive = s.step === "present";
    return header + `<div class="session">${renderModuleList()}<div class="stack">${s.step === "decision" || s.step === "respond" && s.turn?.context === "decision" ? "" : renderModulePanel(interactive)}${renderPracticeStep()}</div></div>`;
  }

  function scoreBlock(s) {
    const covered = Object.values(s.coverage).flat(), pct = Math.round((100 * covered.filter(Boolean).length) / covered.length);
    const stats = [["Points covered", `${pct}%`], ["Teach-backs", s.teachBacks], ["Outcome", s.outcome || "—"]];
    if (s.mode === "practice") stats.splice(1, 0, ["Reactions recognized", `${s.idCorrect}/${s.idTotal}`], ["Responses chosen well", `${s.respCorrect}/${s.respTotal}`]);
    return `<div class="stats">${stats.map(([k, v]) => `<div class="stat"><b>${esc(v)}</b><span class="small muted">${esc(k)}</span></div>`).join("")}</div>`;
  }

  function renderDebriefBody(s, editable) {
    const missing = modules().flatMap((m) => (s.coverage[m.id] || []).map((v, i) => (v ? null : [m.title, m.must_cover[i]])).filter(Boolean));
    const sev = { critical: 0, major: 1, minor: 2 };
    const flags = allFlags().filter((f, i, a) => a.findIndex((x) => x.id === f.id) === i).sort((a, b) => sev[a.severity] - sev[b.severity]);
    const auto = Object.fromEntries(s.autoFlags.map((f) => [f.id, f.reason]));
    const unchecked = pack().pre_conversation_checklist.filter((c) => !s.checklist[c.id]);
    const fmt = (ms) => `${String(Math.floor(ms / 60000)).padStart(2, "0")}:${String(Math.floor(ms / 1000) % 60).padStart(2, "0")}`;
    const evText = (e) => ({
      parent: () => `Parent: “${e.line}”`, identify: () => `Identified as “${reactionLabel(e.choice)}” ${e.correct ? "✓" : `✕ (was “${reactionLabel(e.reaction)}”)`}`,
      respond: () => `Responded: “${e.text}” ${e.correct ? "✓" : "✕"}`, present: () => `Presented “${e.title}” (${e.framing} framing)`,
      teachback: () => (e.done ? "Asked teach-back" : "Skipped teach-back"), guided: () => `Reaction logged: ${reactionLabel(e.reaction)}`,
      decision: () => `Parent decision: ${e.outcome}${e.line ? ` “${e.line}”` : ""}`, pause: () => "Paused; returned later",
      start: () => "Conversation started", end: () => `Session ended: ${e.outcome}`
    }[e.type] || (() => e.type))();
    return `
      ${scoreBlock(s)}
      <section class="card stack"><h2>Flags</h2>
        <p class="small muted">${editable ? "Automatic flags are pre-checked. A supervisor can add or remove flags based on what they observed." : ""}</p>
        <table>${flags.map((f) => `<tr><td style="width:24px"><input type="checkbox" data-flag="${f.id}" ${s.manualFlags.includes(f.id) ? "checked" : ""} ${editable ? "" : "disabled"}></td>
          <td class="sev ${f.severity}" style="width:70px">${f.severity}</td><td>${esc(f.label)}${auto[f.id] ? `<div class="small muted">Auto: ${esc(auto[f.id])}</div>` : ""}</td></tr>`).join("")}</table>
      </section>
      ${missing.length ? `<section class="card stack"><h2>Points not marked as covered</h2><table>${missing.map(([t, i]) => `<tr><td>${esc(t)}</td><td>${esc(i)}</td></tr>`).join("")}</table></section>` : ""}
      ${unchecked.length ? `<section class="card stack"><h2>Checklist items not confirmed</h2><ul>${unchecked.map((c) => `<li>${esc(fillNote(c.item))}</li>`).join("")}</ul></section>` : ""}
      ${renderBriefObjectives(s, editable)}
      <section class="card stack"><h2>Notes</h2><textarea data-bind-session="notes" rows="4" style="width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--surface)" ${editable ? "" : "disabled"}>${esc(s.notes)}</textarea></section>
      <section class="card stack"><h2>Timeline</h2><table class="timeline">${s.events.map((e) => `<tr><td>${fmt(e.t)}</td><td>${esc(evText(e))}</td></tr>`).join("")}</table></section>
      <div class="row"><button class="btn" data-action="export-json">Export JSON</button><button class="btn" data-action="export-csv">Export CSV</button><span class="spacer"></span><button class="btn primary" data-action="home">Back to start</button></div>`;
  }

  // BRIEF section: coverage of each performance objective (from tagged points and checklist items) plus a 1-5 self-rating.
  function renderBriefObjectives(s, editable) {
    const b = brief(); if (!b) return "";
    const tally = {};
    const count = (po, done) => { if (!po) return; const x = (tally[po] = tally[po] || [0, 0]); x[1]++; if (done) x[0]++; };
    modules().forEach((m) => (m.must_cover_po || []).forEach((po, i) => count(po, (s.coverage[m.id] || [])[i])));
    pack().pre_conversation_checklist.forEach((c) => count(c.po, s.checklist[c.id]));
    const ratings = s.briefRatings || {};
    const rows = b.objectives.map((o) => {
      const [done, total] = tally[o.id] || [0, 0];
      const cov = total ? `${done}/${total}` : "—";
      const sel = `<select data-brief="${o.id}" ${editable ? "" : "disabled"} aria-label="Self-rating for ${esc(o.id)}"><option value="">–</option>${[1, 2, 3, 4, 5].map((n) => `<option ${String(ratings[o.id]) === String(n) ? "selected" : ""}>${n}</option>`).join("")}</select>`;
      return `<tr><td><b>${esc(o.id)}</b></td><td>${esc(o.title)}<div class="small muted">${esc(o.self_assessment)}</div></td><td class="${total && done < total ? "warn-text" : ""}">${cov}</td><td>${sel}</td></tr>`;
    }).join("");
    return `<section class="card stack"><h2>BRIEF performance objectives</h2>
      <p class="small muted">Coverage counts the points and checklist items linked to each objective. Rate yourself 1 (not at all) to 5 (fully) for each one. ${esc(b.caveat)}</p>
      <table><tr><th></th><th>Objective</th><th>Covered</th><th>Self-rating</th></tr>${rows}</table>
      <p class="small muted">${esc(b.source)}</p></section>`;
  }

  function renderDebrief() {
    const s = state.session;
    return `<div class="stack" style="max-width:860px"><h1>Debrief</h1>
      <p class="muted">${esc(pack().meta.short_name)} · ${s.mode === "practice" ? esc(s.personaName) : "Guided role-play"} · ${new Date(s.startedAt).toLocaleString()}${s.trainee ? ` · ${esc(s.trainee)}` : ""}</p>
      ${s.mode === "practice" ? `<div class="feedback info small">${esc(persona().name)}'s decision was fixed before the session started. The score measures how well the conversation supported understanding, not whether the family enrolled.</div>` : ""}
      ${renderDebriefBody(s, true)}</div>`;
  }
  function renderHistoryItem() {
    const s = state.historyView;
    return `<div class="stack" style="max-width:860px"><button class="btn ghost" data-action="home">← Back</button><h1>Past session</h1>
      <p class="muted">${esc(s.study)} · ${esc(s.personaName || "Guided role-play")} · ${new Date(s.startedAt).toLocaleString()}${s.trainee ? ` · ${esc(s.trainee)}` : ""}</p>${renderDebriefBody(s, false)}</div>`;
  }

  function renderModal() {
    const m = state.modal;
    if (m.kind === "gate") {
      const byModule = {};
      m.missing.forEach(({ module, item }) => { (byModule[module.id] = byModule[module.id] || { module, items: [] }).items.push(item); });
      return `<div class="modal-bg"><div class="card modal stack" role="dialog" aria-modal="true"><h2>Not everything has been covered</h2>
        <p class="small">A parent shouldn't be asked to decide until every required point has been explained. Go back, or continue and have it recorded.</p>
        ${Object.values(byModule).map(({ module, items }) => `<div><div class="row"><b>${esc(module.title)}</b><span class="spacer"></span><button class="btn" data-action="goto" data-i="${modules().indexOf(module)}">Go back</button></div><ul class="small">${items.map((i) => `<li>${esc(i)}</li>`).join("")}</ul></div>`).join("")}
        <div class="row"><span class="spacer"></span><button class="btn danger" data-action="gate-continue">Continue anyway</button></div></div></div>`;
    }
    if (m.kind === "guided-end") {
      return `<div class="modal-bg"><div class="card modal stack" role="dialog" aria-modal="true"><h2>How did the conversation end?</h2>
        <div class="grid cols-2">${["consented", "declined", "needs time", "ineligible", "paused"].map((o) => `<button class="btn" data-action="end" data-outcome="${o}">${cap(o)}</button>`).join("")}</div>
        <div class="row"><span class="spacer"></span><button class="btn ghost" data-action="close-modal">Cancel</button></div></div></div>`;
    }
    if (m.kind === "abandon") {
      return `<div class="modal-bg"><div class="card modal stack" role="dialog" aria-modal="true"><h2>Stop this session?</h2><p class="small">It will be saved as “stopped” with what you've done so far.</p>
        <div class="row"><span class="spacer"></span><button class="btn ghost" data-action="close-modal">Keep going</button><button class="btn danger" data-action="end" data-outcome="stopped">Stop</button></div></div></div>`;
    }
    return "";
  }

  /* ---------- export ---------- */
  function download(name, text, type) {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([text], { type }));
    a.download = name; document.body.appendChild(a); a.click(); a.remove();
  }
  function exportName(s, ext) { return `${s.study}-${s.mode}-${new Date(s.startedAt).toISOString().slice(0, 16).replace(/[:T]/g, "")}.${ext}`; }
  function toCSV(s) {
    const q = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
    const rows = [["session_id", "study", "pack_version", "mode", "persona", "trainee", "elapsed_s", "event", "module", "reaction", "choice", "correct", "text"]];
    Object.entries(s.briefRatings || {}).forEach(([po, v]) => rows.push([s.id, s.study, s.packVersion, s.mode, s.personaName || "", s.trainee, "", "brief_rating", "", "", po, "", v]));
    s.events.forEach((e) => rows.push([s.id, s.study, s.packVersion, s.mode, s.personaName || "", s.trainee, Math.round(e.t / 1000), e.type, e.module, e.reaction || "", e.choice || e.framing || "", e.correct ?? "", e.text || e.line || e.title || ""]));
    return rows.map((r) => r.map(q).join(",")).join("\n");
  }

  /* ---------- events ---------- */
  app.addEventListener("click", (ev) => {
    const el = ev.target.closest("[data-action]"); if (!el || el.disabled) return;
    const s = state.session, a = el.dataset.action;
    switch (a) {
      case "study": state.studyIdx = +el.dataset.i; state.personaId = null; break;
      case "mode": state.mode = el.dataset.mode; break;
      case "persona": state.personaId = el.dataset.id; break;
      case "brief": state.session = newSession(state.mode); state.view = "brief"; break;
      case "start": {
        state.view = "session";
        s.startedAt = Date.now();
        log("start", {});
        const p = persona();
        if (s.mode === "practice" && p.opening) parentTurn(p.opening, "opening");
        else s.step = "present";
        break;
      }
      case "framing": state.framing[modules()[s.current].id] = el.dataset.k; break;
      case "goto": {
        s.current = +el.dataset.i; if (!s.visited.includes(s.current)) s.visited.push(s.current);
        if (s.mode === "practice") {
          // Going back to cover missed points: presenting again doesn't replay the parent's reaction.
          s.step = "present"; s.turn = null;
          s.revisit = s.reachedEnd || s.current !== Math.max(...s.visited);
        }
        state.modal = null; break;
      }
      case "present": {
        const m = modules()[s.current], framing = state.framing[m.id] || Object.keys(m.framings)[0];
        (s.framingsUsed[m.id] = s.framingsUsed[m.id] || []).push(framing);
        log("present", { title: m.title, framing });
        if (s.revisit) {
          s.revisit = false;
          if (s.reachedEnd) { s.step = "gate"; const missing = missingCoverage(); if (missing.length) state.modal = { kind: "gate", missing }; else startDecision(); }
          else s.current = Math.max(...s.visited);
          break;
        }
        parentTurn(persona().reactions[m.id], "module");
        break;
      }
      case "identify": {
        const t = s.turn; t.idChoice = el.dataset.id;
        const correct = t.idChoice === t.reactionId;
        s.idTotal++; if (correct) s.idCorrect++;
        log("identify", { reaction: t.reactionId, choice: t.idChoice, correct });
        break;
      }
      case "after-identify": {
        const t = s.turn;
        if (t.reactionId === ENGAGED) { advance(); break; }
        t.respOptions = buildResponseOptions(t.reactionId); s.step = "respond"; break;
      }
      case "respond": {
        const t = s.turn; t.respChoice = +el.dataset.i;
        const o = t.respOptions[t.respChoice], correct = o.kind === "correct";
        s.respTotal++; if (correct) s.respCorrect++;
        log("respond", { reaction: t.reactionId, choice: o.kind, correct, text: o.text });
        if (!correct) addFlag(reactionCatalog()[t.reactionId].flag_on_wrong, `Chose “${o.text}” when the parent showed: ${reactionLabel(t.reactionId)}`);
        break;
      }
      case "after-respond": {
        const r = reactionCatalog()[s.turn.reactionId];
        if (r.teach_back) { s.step = "teachback"; break; }
        afterTurn(); break;
      }
      case "teachback": {
        const done = el.dataset.done === "1"; if (done) s.teachBacks++;
        log("teachback", { done, reaction: s.turn.reactionId }); afterTurn(); break;
      }
      case "gate-continue": startDecision(); break;
      case "end": state.modal = null; endSession(el.dataset.outcome); break;
      case "guided-reaction": state.guidedReaction = el.dataset.id; log("guided", { reaction: el.dataset.id }); break;
      case "guided-clear": state.guidedReaction = null; break;
      case "guided-teachback": s.teachBacks++; log("teachback", { done: true, reaction: state.guidedReaction }); break;
      case "guided-end": state.modal = { kind: "guided-end" }; break;
      case "abandon": state.modal = { kind: "abandon" }; break;
      case "close-modal": state.modal = null; break;
      case "home": state.view = "home"; state.session = null; state.modal = null; state.guidedReaction = null; state.historyView = null; break;
      case "open-history": {
        state.historyView = loadSessions().find((x) => x.id === el.dataset.id);
        state.studyIdx = C.studies.findIndex((st) => st.pack.meta.short_name === state.historyView.study);
        state.view = "history"; break;
      }
      case "delete-history": if (confirm("Delete this session from this device?")) saveSessions(loadSessions().filter((x) => x.id !== el.dataset.id)); break;
      case "export-json": { const x = state.historyView || s; download(exportName(x, "json"), JSON.stringify(x, null, 2), "application/json"); return; }
      case "export-csv": { const x = state.historyView || s; download(exportName(x, "csv"), toCSV(x), "text/csv"); return; }
    }
    render();
  });

  function afterTurn() {
    const s = state.session, t = s.turn, correct = t.respOptions[t.respChoice].kind === "correct";
    const ends = reactionCatalog()[t.reactionId].ends_session;
    if (ends) return endSession(ends);
    if (t.reactionId === "overwhelmed" && correct) log("pause", {});
    if (t.context === "opening") { s.turn = null; s.step = "present"; return; }
    advance();
  }

  app.addEventListener("change", (ev) => {
    const el = ev.target, s = state.session;
    if (el.dataset.cover !== undefined) { s.coverage[modules()[s.current].id][+el.dataset.cover] = el.checked; render(); }
    else if (el.dataset.check) s.checklist[el.dataset.check] = el.checked;
    else if (el.dataset.brief) { s.briefRatings = { ...(s.briefRatings || {}), [el.dataset.brief]: el.value }; persist(s); }
    else if (el.dataset.flag) {
      const set = new Set(s.manualFlags); el.checked ? set.add(el.dataset.flag) : set.delete(el.dataset.flag);
      s.manualFlags = [...set]; persist(s);
    }
  });
  app.addEventListener("input", (ev) => {
    const el = ev.target;
    if (el.dataset.bind) { state[el.dataset.bind] = el.value; return; }
    if (el.dataset.bindSession) { state.session[el.dataset.bindSession] = el.value; persist(state.session); }
  });
  document.querySelector("[data-action=home]").addEventListener("click", () => { state.view = "home"; state.session = null; state.modal = null; state.historyView = null; render(); });

  render();
})();
</script>
</body>
</html>
